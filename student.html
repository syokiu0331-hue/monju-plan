<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文殊 学習計画</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a55ae">
<link rel="manifest" href="manifest-student.webmanifest">
<link rel="icon" type="image/png" href="student-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="student-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学習計画">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<link rel="stylesheet" href="app.css">
<style>
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#2a55ae;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;transition:opacity .4s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:104px;height:104px;border-radius:24px;box-shadow:0 10px 28px rgb(0 0 0 / .28),0 0 0 1px rgb(255 255 255 / .16)}
#splash .nm{font-size:20px;font-weight:700;letter-spacing:.06em;margin-top:6px}
#splash .sc{font-size:12px;opacity:.75;letter-spacing:.12em}
#splash .bar{width:128px;height:3px;border-radius:2px;background:rgb(255 255 255 / .22);overflow:hidden;margin-top:14px}
#splash .bar i{display:block;width:40%;height:100%;background:#fff;border-radius:2px;animation:sp 1.1s ease-in-out infinite}
#splash .note{font-size:12px;opacity:.7;min-height:1.4em}
@keyframes sp{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#splash .bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="起動中"><img src="student-192.png" alt="" width="104" height="104"><div class="nm">文殊 学習計画</div><div class="sc">総合学習塾 文殊　生徒用</div><div class="bar"><i></i></div><div class="note" id="splashNote"></div></div>
<header class="appbar"><div class="wrap">
  <div class="brand">文殊 学習計画<small id="schoolName"></small></div>
  <div class="who" id="who"></div>
</div></header>
<div class="install-hint" id="installHint" hidden></div>
<main><div class="wrap" id="app"></div></main>
<div class="modal" id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden>保存中…</div>
<div id="pdfStage" aria-hidden="true"></div>
<script src="config.js"></script>
<script>window.APP_KIND = "student";</script>
<script src="app.js"></script>
</body>
</html>
